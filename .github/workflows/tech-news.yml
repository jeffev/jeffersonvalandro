name: Update tech news digest

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC ≈ 08:00 BRT, daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tech-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate news.html
        run: node scripts/generate-news.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- news.html; then
            echo "No changes to news.html — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.html
          git commit -m "chore: update tech news digest"
          git push
