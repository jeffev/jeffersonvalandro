name: Wake demo backends

# The demo backends run on Render's free plan, which sleeps after 15 minutes
# without traffic and shares 750 instance-hours a month across the account.
# Keeping them awake only from 14:00 to 20:00 (Brasília, UTC-3) costs about
# 186 hours each, leaving room for visits outside that window.
on:
  schedule:
    # 17:00–22:55 UTC = 14:00–19:55 in Brasília; the last ping keeps the
    # services up until about 20:10.
    - cron: "*/5 17-22 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoints
        run: |
          for url in \
            https://investlink-api-v2ni.onrender.com/health \
            https://vizion-api-qhup.onrender.com/health \
            https://tradelink-joj4.onrender.com/api/health
          do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url" || true)
            echo "$url -> $status"
          done
