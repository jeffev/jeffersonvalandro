<!doctype html>
<!-- Source of public/og.png (1200x630). Regenerate with: npm run og -->
<html><head><meta charset="utf-8">
<style>
  @import url('../node_modules/@fontsource-variable/space-grotesk/wght.css');
  @import url('../node_modules/@fontsource/jetbrains-mono/400.css');
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #eef0f2; font-family: 'Space Grotesk Variable', sans-serif; color: #14181d;
    background-image: linear-gradient(rgba(20,24,29,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(20,24,29,.06) 1px, transparent 1px);
    background-size: 32px 32px; padding: 56px; }
  .card { height: 100%; overflow: hidden; grid-template-rows: 100%; background: #fafbfc; border: 2px solid #cfd5db; display: grid; grid-template-columns: 1fr 360px; }
  .main { padding: 56px; border-right: 2px solid #cfd5db; display: flex; flex-direction: column; }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #545d67; }
  h1 { font-size: 64px; line-height: 1.02; letter-spacing: -0.035em; margin: 26px 0 auto; }
  h1 span { color: #c8461f; }
  .name { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .name i { color: #c8461f; font-style: normal; }
  img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
</style></head>
<body><div class="card">
  <div class="main">
    <span class="mono">// engenheiro de software · backend · arquitetura · IA</span>
    <h1>Sistemas que escalam.<br>Produtos que <span>vão pro ar.</span></h1>
    <div class="name">jefferson<i>.</i>valandro</div>
  </div>
  <img src="../public/me.jpg" alt="">
</div></body></html>
